model:
  # Active scene name: mujoco_corrected.
  # Corrected MJCF (2026-07-08): inertials from URDF source, joint damping=0,
  # frictionloss=0, actuator forcerange set.  Use this for valid sim-to-sim.
  scene_xml: "/home/cocel/Desktop/Research/tita_gluon_wbc/tita_gluon_ws/src/ddt_ros2_control/urdfs/tita_description/mujoco_corrected/scene.xml"
  # Original MJCF (incorrect inertials, damping=0.1, frictionloss=0.2 — kept for reference):
  # scene_xml: "/home/cocel/Desktop/Research/tita_gluon_wbc/tita_gluon_ws/src/ddt_ros2_control/urdfs/tita_description/mujoco/scene.xml"

policy:
  # My31@2999 (final checkpoint) = My27 + track_lin_vel_xy_exp weight 1.0->2.0,
  # track_ang_vel_z_exp weight 0.5->2.0 (zero_command_position_drift left
  # unchanged at My27's weight=1.0/sharpness=16.0). Unlike My27 (wildly
  # non-monotonic, only iter 2500 was good), this run converged cleanly --
  # iter 2000 through 2999 all give good zero-command drift (~0.01-0.09m/10s,
  # repeatable), no cherry-picking needed. See RL_Experiments.md /
  # Sim2Sim_Experiments.md 2026-07-23.
  path: "/home/cocel/Desktop/Research/tita_gluon_wbc/tita_gluon_ws/deploy/tita/policy_my40_2000.onnx"
  input_obs_name: "nn_input0"
  input_history_name: "nn_input1"
  output_name: "nn_output"
  obs_dim: 33
  history_len: 0
  action_dim: 8
  include_base_lin_vel: false

viewer:
  enabled: true
  show_left_ui: false
  show_right_ui: false

tita_ns: "tita"

topics:
  use_manual_topics: true
  enable_legacy_command_aliases: true
  manual:
    cmd_twist: "/tita/command/manager/cmd_twist"
    cmd_pose: "/tita/command/manager/cmd_pose"
    cmd_key: "/tita/command/manager/cmd_key"
    joy: "/joy"
  legacy:
    cmd_twist: "/command/cmd_twist"
    cmd_key: "/command/cmd_key"

plot:
  enabled: false
  publish_rate_hz: 50.0
  namespace: "/cosim_ros2_jazzy/plot"

diagnostic:
  enabled: false
  publish_rate_hz: 50.0
  namespace: "/cosim_ros2_jazzy/diagnostic"

control:
  control_rate: 50
  # Match Isaac Lab TITA training config: sim.dt=0.005, decimation=4, policy_dt=0.02.
  sim_timestep: 0.005
  decimation: 4
  real_time: true

timing:
  # Native runtime alias: isaac_reference_50hz.
  mode: "isaac_reference_50hz"   # options: "current", "ddt_reference_500hz", "isaac_reference_50hz"
  physics_dt: 0.005
  torque_update_rate_hz: 250.0
  policy_rate_hz: 50.0
  action_hold_steps: 4

action_adapter:
  # Isaac JointPositionActionCfg / JointVelocityActionCfg use clip [-100, 100].
  # Keep clipping configurable, but default to Isaac's effectively-unclipped behavior.
  clip_action: true
  action_clip_min: -100.0
  action_clip_max: 100.0
  wheel_sign: 1.0
  # null means use robot.action_scale for wheel slots.
  wheel_velocity_scale:
  # null means use robot.joint_kd for wheel slots.
  wheel_vel_kd:

rl_adapter:
  mode: "ddt_reference"   # options: "current", "ddt_reference"
  ddt_reference:
    # 2026-07-08: corrected to match Isaac DDT_TITA_CFG actuator parameters.
    # legs: DCMotorCfg(stiffness=60, damping=1.5, effort_limit=60)
    # wheels: ImplicitActuatorCfg(stiffness=0, damping=0.5, effort_limit_sim=12)
    # action_scale from robot.action_scale: [0.25, 0.25, 0.25, 5.0, ...]
    # default_joint_angles: Isaac training default [0.1, 0.8, -1.5, 0.0, ...]
    control_type: "P_V"
    default_joint_angles: [0.1, 0.8, -1.5, 0.0, 0.1, 0.8, -1.5, 0.0]
    joint_kp: [60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0]
    joint_kd: [1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5]
    action_scales: [0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0]
    clip_action: false
    action_clip_min: -100.0
    action_clip_max: 100.0
    torque_limit: [60.0, 60.0, 60.0, 12.0, 60.0, 60.0, 60.0, 12.0]
    # NOTE: unused by any Python code. Actual policy rate is driven by
    # timing.mode/policy_rate_hz + control.control_rate (= 50Hz). Set to 0.02
    # to match Isaac training (dec 4 x sim.dt 0.005) and avoid confusion.
    policy_time_interval: 0.02

obs_adapter:
  mode: "isaac_reference"   # options: "current", "ddt_reference", "isaac_reference"
  ddt_reference:
    default_joint_angles: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]
    zero_wheel_pos: true
    command_scale: [2.0, 2.0, 0.25]
    gyro_lpf_alpha_current: 0.97
    gyro_lpf_alpha_prev: 0.03
  isaac_reference:
    default_joint_angles: [0.1, 0.8, -1.5, 0.0, 0.1, 0.8, -1.5, 0.0]
    zero_wheel_pos: true
    command_scale: [2.0, 2.0, 0.25]
    gyro_lpf_alpha_current: 0.97
    gyro_lpf_alpha_prev: 0.03
    projected_gravity_mode: "isaac"

rl_policy:
  forward_rate_hz: 50.0

command:
  default_lin_x: 0.0
  default_lin_y: 0.0
  default_ang_z: 0.0
  max_lin_x: 0.2
  max_lin_y: 0.0
  max_ang_z: 0.3
  scale: [2.0, 2.0, 0.25]

poses:
  # Reference ddt_ros2_control transform_down.fold_jpos.
  idle_joint_angles: [0.5, 1.2, -2.7, 0.0, -0.5, 1.2, -2.7, 0.0]
  idle: [0.5, 1.2, -2.7, 0.0, -0.5, 1.2, -2.7, 0.0]
  # Reference ddt_ros2_control transform_up.fold_jpos.
  fold_joint_angles: [0.75, 1.2, -2.7, 0.0, -0.75, 1.2, -2.7, 0.0]
  ddt_stand: [-0.05, 0.9, -2.6, 0.0, 0.05, 0.9, -2.6, 0.0]
  low_stand_1: [0.0, 0.9, -2.2, 0.0, 0.0, 0.9, -2.2, 0.0]
  low_stand_2: [0.05, 0.85, -2.0, 0.0, 0.05, 0.85, -2.0, 0.0]
  # Isaac training/default standing pose used by the current policy traces.
  standing_joint_angles: [0.1, 0.8, -1.5, 0.0, 0.1, 0.8, -1.5, 0.0]
  policy_stand: [0.1, 0.8, -1.5, 0.0, 0.1, 0.8, -1.5, 0.0]
  rl_default: [0.0, 0.8, -1.5, 0.0, 0.0, 0.8, -1.5, 0.0]

manual_joint_control:
  enabled: true
  # Manual viewer mode controls leg joints as position targets and holds wheel joints at zero velocity.
  wheel_mode: "zero_velocity"
  max_delta_per_command: 0.5
  joint_target_min: [-2.0, -2.5, -3.0, -20.0, -2.0, -2.5, -3.0, -20.0]
  joint_target_max: [2.0, 2.5, 1.0, 20.0, 2.0, 2.5, 1.0, 20.0]

transform_up:
  mode: "trajectory"
  final_pose_mode: "policy_stand"
  duration: 3.0
  settle_time: 0.5
  idle_joint_angles: [0.5, 1.2, -2.7, 0.0, -0.5, 1.2, -2.7, 0.0]
  mid_joint_angles: [-0.05, 0.9, -2.6, 0.0, 0.05, 0.9, -2.6, 0.0]
  standing_joint_angles: [0.1, 0.8, -1.5, 0.0, 0.1, 0.8, -1.5, 0.0]
  use_wheel_balance: true
  pitch_kp: 2.0
  pitch_kd: 0.3
  wheel_vel_limit: 3.0
  # null uses robot.joint_kd for wheel velocity servo. Numeric values override only during transform_up.
  wheel_vel_gain_override:
  balance_sign: 1.0

reference_transform_up:
  enabled: true
  fold_jpos: [0.75, 1.20, -2.7, 0.0, -0.75, 1.2, -2.7, 0.0]
  stand_jpos: [-0.05, 0.9, -2.6, 0.0, 0.05, 0.90, -2.6, 0.0]
  # policy_jpos: optional phase-3 target (requires policy_timer > 0). Disabled here.
  policy_timer: 0.0
  fold_timer: 4.0
  stand_timer: 2.0
  settle_iters: 100
  update_rate: 500.0
  joint_kp: [600.0, 80.0, 80.0, 0.0, 600.0, 80.0, 80.0, 0.0]
  joint_kd: [8.0, 8.0, 8.0, 0.5, 8.0, 8.0, 8.0, 0.5]
  ff_torque: [-20.0, 0.0, -25.0, 0.0, 20.0, 0.0, -25.0, 0.0]
  wheel_kp: 0.0
  wheel_kd: 0.5
  wheel_qd_des: 0.0
  use_imu_wheel_balance: false

handoff_bridge:
  enabled: true
  source_pose: "low_stand_1"
  target_pose: "policy_stand"
  duration: 3.0
  settle_time: 1.0
  use_wheel_balance: true
  wheel_vel_gain_override: 5.0
  wheel_vel_limit: 3.0
  balance_sign: 1.0
  allow_rl_after_bridge: true

pose_hold_test:
  pose_mode: "policy_stand"
  duration: 5.0
  use_wheel_balance: false
  wheel_zero_velocity_hold: true
  controller_mode: "default"

robot:
  base_body_name: "base_link"
  imu_site_name: "trunk_imu"
  imu_quat_sensor: "trunk_quat"
  imu_gyro_sensor: "trunk_gyro"
  imu_accel_sensor: "trunk_accel"
  joint_names:
    - "joint_left_leg_1"
    - "joint_left_leg_2"
    - "joint_left_leg_3"
    - "joint_left_leg_4"
    - "joint_right_leg_1"
    - "joint_right_leg_2"
    - "joint_right_leg_3"
    - "joint_right_leg_4"
  actuator_names:
    - "left_leg_1"
    - "left_leg_2"
    - "left_leg_3"
    - "left_leg_4"
    - "right_leg_1"
    - "right_leg_2"
    - "right_leg_3"
    - "right_leg_4"
  wheel_indices: [3, 7]
  default_joint_angles: [0.1, 0.8, -1.5, 0.0, 0.1, 0.8, -1.5, 0.0]
  # real TITA's actual RL-entry posture -- see cosim_ros2_jazzy/config/tita.yaml
  reset_joint_angles: [-0.024, 0.891, -2.634, 0.0, 0.028, 0.894, -2.648, 0.0]
  standing_joint_angles: [0.1, 0.8, -1.5, 0.0, 0.1, 0.8, -1.5, 0.0]
  reset_base_pos: [0.0, 0.0, 0.40]
  reset_base_quat: [1.0, 0.0, 0.0, 0.0]
  # Action order is native [L1, L2, L3, L4, R1, R2, R3, R4].
  # Training config uses 0.25 for leg position actions and 5.0 for wheel velocity actions.
  # Webots controllers.yaml currently has a different action_scales vector for wheels; keep this visible.
  action_scale: [0.25, 0.25, 0.25, 5.0, 0.25, 0.25, 0.25, 5.0]
  joint_kp: [60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0]
  joint_kd: [1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5]
  torque_limit: [60.0, 60.0, 60.0, 12.0, 60.0, 60.0, 60.0, 12.0]

observation:
  order: ["ang_vel", "gravity", "commands", "dof_pos", "dof_vel", "last_actions"]
  base_lin_vel_scale: 2.0
  ang_vel_scale: 0.25
  gravity_scale: 1.0
  projected_gravity_sign: 1.0
  projected_gravity_mode: "isaac"
  dof_pos_scale: 1.0
  dof_vel_scale: 0.05
  command_scale: [2.0, 2.0, 0.25]
  # Observation joint order is interleaved [L1, R1, L2, R2, L3, R3, L4, R4].
  reindex: [0, 4, 1, 5, 2, 6, 3, 7]
  re_sign: []
  # Matches rl_controller: wheel joint positions are zeroed before subtracting defaults.
  zero_wheel_pos: true

debug:
  publish_rate: 50
  # Legacy key; action_adapter.clip_action is the active setting.
  clip_action: true
