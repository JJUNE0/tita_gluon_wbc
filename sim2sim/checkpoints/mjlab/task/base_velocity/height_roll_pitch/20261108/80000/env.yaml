backend: mjlab
scene:
  robot:
    init_state:
      pos:
      - 0.0
      - 0.0
      - 0.4
      rot:
      - 1.0
      - 0.0
      - 0.0
      - 0.0
      lin_vel:
      - 0.0
      - 0.0
      - 0.0
      ang_vel:
      - 0.0
      - 0.0
      - 0.0
      joint_pos:
        joint_left_leg_1: 0.0
        joint_left_leg_2: 0.8
        joint_left_leg_3: -1.5
        joint_left_leg_4: 0.0
        joint_right_leg_1: 0.0
        joint_right_leg_2: 0.8
        joint_right_leg_3: -1.5
        joint_right_leg_4: 0.0
      joint_vel:
        .*: 0.0
    actuators:
      group_0:
        joint_names_expr:
        - .*_leg_[12]
        stiffness: 60.0
        damping: 1.5
        effort_limit: 60.0
      group_1:
        joint_names_expr:
        - .*_leg_3
        stiffness: 92.0
        damping: 2.3
        effort_limit: 60.0
      group_2:
        joint_names_expr:
        - .*_leg_4
        stiffness: 0.0
        damping: 0.5
        effort_limit: 12.0
    wheel_collision: sphere
  terrain:
    terrain_type: plane
sim:
  dt: 0.005
decimation: 4
observations:
  policy:
    concatenate_terms: true
    history_length: 0
    base_ang_vel:
      func: base_ang_vel
      params: {}
      scale: 0.25
      clip:
      - -100
      - 100
    projected_gravity:
      func: projected_gravity
      params: {}
      scale: 1.0
      clip:
      - -100
      - 100
    velocity_commands:
      func: generated_commands
      params:
        command_name: base_velocity
      scale:
      - 2.0
      - 2.0
      - 0.25
      clip:
      - -100
      - 100
    joint_pos:
      func: joint_pos_rel_without_wheel
      params:
        asset_cfg:
          name: robot
          joint_names:
          - joint_left_leg_1
          - joint_right_leg_1
          - joint_left_leg_2
          - joint_right_leg_2
          - joint_left_leg_3
          - joint_right_leg_3
          - joint_left_leg_4
          - joint_right_leg_4
          preserve_order: true
      scale: 1.0
      clip:
      - -100
      - 100
    joint_vel:
      func: joint_vel_rel
      params:
        asset_cfg:
          name: robot
          joint_names:
          - joint_left_leg_1
          - joint_right_leg_1
          - joint_left_leg_2
          - joint_right_leg_2
          - joint_left_leg_3
          - joint_right_leg_3
          - joint_left_leg_4
          - joint_right_leg_4
          preserve_order: true
      scale: 0.05
      clip:
      - -100
      - 100
    actions:
      func: last_action
      params: {}
      scale: 1.0
      clip:
      - -100
      - 100
    wheel_position_error:
      func: WheelPositionError
      params:
        command_name: base_velocity
        radius: 0.0925
        clip_m: 0.3
        zero_thresholds:
        - 0.02
        - 0.02
        - 0.03
        velocity_thresholds:
        - 0.1
        - 0.15
        moving_anchor: true
      scale: 5.0
      clip:
      - -100
      - 100
    heading_error:
      func: GyroHeadingError
      params:
        command_name: base_velocity
        clip_rad: 0.5
        zero_thresholds:
        - 0.02
        - 0.02
        - 0.03
        warmup_s: 0.0
      scale: 2.0
      clip:
      - -100
      - 100
    pose_commands:
      func: generated_commands
      params:
        command_name: base_pose
      scale:
      - 1.0
      - 1.0
      - 1.0
      clip: null
actions:
  joint_pos_0:
    class_type: JointPositionAction
    joint_names:
    - joint_left_leg_1
    scale: 0.25
    use_default_offset: true
    clip:
      .*:
      - -100.0
      - 100.0
    preserve_order: true
  joint_pos_1:
    class_type: JointPositionAction
    joint_names:
    - joint_left_leg_2
    scale: 0.25
    use_default_offset: true
    clip:
      .*:
      - -100.0
      - 100.0
    preserve_order: true
  joint_pos_2:
    class_type: JointPositionAction
    joint_names:
    - joint_left_leg_3
    scale: 0.25
    use_default_offset: true
    clip:
      .*:
      - -100.0
      - 100.0
    preserve_order: true
  joint_vel_3:
    class_type: JointVelocityAction
    joint_names:
    - joint_left_leg_4
    scale: 20.0
    use_default_offset: true
    clip:
      .*:
      - -100.0
      - 100.0
    preserve_order: true
  joint_pos_4:
    class_type: JointPositionAction
    joint_names:
    - joint_right_leg_1
    scale: 0.25
    use_default_offset: true
    clip:
      .*:
      - -100.0
      - 100.0
    preserve_order: true
  joint_pos_5:
    class_type: JointPositionAction
    joint_names:
    - joint_right_leg_2
    scale: 0.25
    use_default_offset: true
    clip:
      .*:
      - -100.0
      - 100.0
    preserve_order: true
  joint_pos_6:
    class_type: JointPositionAction
    joint_names:
    - joint_right_leg_3
    scale: 0.25
    use_default_offset: true
    clip:
      .*:
      - -100.0
      - 100.0
    preserve_order: true
  joint_vel_7:
    class_type: JointVelocityAction
    joint_names:
    - joint_right_leg_4
    scale: 20.0
    use_default_offset: true
    clip:
      .*:
      - -100.0
      - 100.0
    preserve_order: true
commands:
  base_velocity:
    ranges:
      lin_vel_x:
      - -1.5
      - 1.5
      lin_vel_y:
      - 0.0
      - 0.0
      ang_vel_z:
      - -3.0
      - 3.0
    ramp_rate: 0.0
    initial_phase_time: 0.0
  base_pose:
    class_type: RollPitchHeightCommand
    order:
    - roll
    - pitch
    - height
    units:
    - rad
    - rad
    - m
    resampling_time_range:
    - 10.0
    - 12.0
    debug_vis: false
    roll_range:
    - -0.5235987755982988
    - 0.5235987755982988
    pitch_range:
    - -0.2617993877991494
    - 0.2617993877991494
    height_range:
    - 0.27
    - 0.42
    nominal_height: 0.335
    rel_nominal_envs: 0.2
    ramp_rates:
    - 0.15
    - 0.15
    - 0.02
    height_target_bands: null
    height_motion_range: null
