/**:
  controller_manager:
    ros__parameters:
      update_rate: 500
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      imu_sensor_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
      tita_stage1_controller:
        type: tita_stage1_controller/Stage1Controller

  joint_state_broadcaster:
    ros__parameters:
      update_rate: 500

  imu_sensor_broadcaster:
    ros__parameters:
      update_rate: 500
      sensor_name: trunk_imu
      frame_id: trunk_imu

  tita_stage1_controller:
    ros__parameters:
      stage1_only: false
      joints:
        - joint_left_leg_1
        - joint_left_leg_2
        - joint_left_leg_3
        - joint_left_leg_4
        - joint_right_leg_1
        - joint_right_leg_2
        - joint_right_leg_3
        - joint_right_leg_4
      transform_up:
        fold_jpos: [0.75, 1.20, -2.7, 0.0, -0.75, 1.2, -2.7, 0.0]
        stand_jpos: [-0.05, 0.9, -2.6, 0.0, 0.05, 0.90, -2.6, 0.0]
        fold_timer: 4.0
        stand_timer: 2.0
        ff_torque: [-20.0, 0.0, -25.0, 0.0, 20.0, 0.0, -25.0, 0.0]
        joint_kp: [600.0, 80.0, 80.0, 5.0, 600.0, 80.0, 80.0, 5.0]
        joint_kd: [8.0, 8.0, 8.0, 0.5, 8.0, 8.0, 8.0, 0.5]
        transition_lower_limits: [-0.785398, -1.919862, -2.700000, -62831.85, -0.785398, -1.919862, -2.700000, -62831.85]
        transition_upper_limits: [0.785398, 3.490659, -0.698132, 62831.85, 0.785398, 3.490659, -0.698132, 62831.85]
      settle:
        seconds: 5.0
        stand_error_rad: 0.15
        wheel_velocity_rad_s: 0.3
      safety:
        lower_limits: [-0.785398, -1.919862, -2.670354, -62831.85, -0.785398, -1.919862, -2.670354, -62831.85]
        upper_limits: [0.785398, 3.490659, -0.698132, 62831.85, 0.785398, 3.490659, -0.698132, 62831.85]
        effort_limits: [60.0, 60.0, 60.0, 12.0, 60.0, 60.0, 60.0, 12.0]
        max_roll_rad: 0.35
        max_pitch_rad: 0.35
        fall_tilt_rad: 0.65
        # Operator-approved diagnostic margin after two native-mapped real runs crossed 1.5
        # rad/s at small roll/pitch. Fall tilt, torque clipping, and all other watchdogs remain.
        max_angular_velocity_rad_s: 2.5
        max_target_slew_rad_s: 1.5
        # Bounded Stage 2 diagnostic allowance. The first two real attempts observed a
        # single 10.555 ms scheduler/write-path spike while the nominal loop remained 500 Hz.
        # Stage 1 retains its 10 ms limit; every other watchdog remains unchanged.
        max_period_seconds: 0.015
        hardware_state_wait_timeout_seconds: 1.0
        hardware_state_stable_seconds: 0.10
        operational_entry_timeout_seconds: 2.0
        # Do not leave TransformUp merely because measured q touched the envelope.
        # Hold official stand until it is safely inside and mechanically settled.
        operational_entry_stable_seconds: 0.10
        operational_entry_margin_rad: 0.02
        operational_entry_max_joint_velocity_rad_s: 0.5
        # Float policy targets are compared against double limits. This tolerance
        # covers representation error only; commands remain clamped to the limits.
        operational_envelope_tolerance_rad: 1.0e-6
        command_transport_tolerance_rad: 1.0e-9
        write_failure_threshold: 3
      stage2:
        enabled: true
        # Validated cosim_ros2_jazzy handoff: official DDT stand -> policy stand.
        policy_stand_jpos: [0.1, 0.8, -1.5, 0.0, 0.1, 0.8, -1.5, 0.0]
        handoff_seconds: 3.0
        handoff_settle_seconds: 1.0
        policy_path: /home/robot/tita_policy/policy.onnx
        policy_sha256: d53a5b0b69e5382dc5f40909ecaa7481221397aa3b3400c922b13a33576273e6
        policy_rate_hz: 50.0
        joint_kp: [60.0, 60.0, 60.0, 0.0, 60.0, 60.0, 60.0, 0.0]
        joint_kd: [1.5, 1.5, 1.5, 0.5, 1.5, 1.5, 1.5, 0.5]
        # One 50 Hz validation frame. History is seeded from the real bridge-complete
        # observation and previous_action remains zero until RL_BLEND starts.
        rl_prepare_seconds: 0.02
        # One 50 Hz policy interval: a bounded monotonic 10-cycle ramp at the
        # 500 Hz command rate without an untrained one-second hybrid loop.
        rl_blend_seconds: 0.02
        # One-off zero-command diagnostic: clipped targets may continue through blend,
        # but all sensor/finite/tilt/deadline/write/CAN watchdogs remain fail-closed.
        rl_running_seconds: 1.0
        require_zero_joystick: true
        allow_clipped_rl_diagnostic: true
        # Bounded zero-command Stage 2 envelope derived from the validated sim2sim
        # ddt_reference run (effectively unclipped actions, 60/12 Nm torque limits).
        # The first real standing inference required 0.926 rad; retain a 1.0 rad cap.
        max_leg_target_delta_rad: 1.0
        # Sim-matched timing: the full bounded operational span can be selected
        # within one 500 Hz controller cycle, as in the 50 Hz MuJoCo P_V adapter.
        max_leg_target_slew_rad_s: 3000.0
        # Sim2sim observed 13.37 rad/s during the accepted 1 s zero-command run.
        max_wheel_velocity_rad_s: 15.0
        max_wheel_accel_rad_s: 15000.0
        max_inference_seconds: 0.010
        max_repeated_clipping: 5
        joy_topic: /tita4252763/joy
        joy_timeout_seconds: 0.25
        joy_zero_tolerance: 0.05
        # Exact upstream teleop_command mapping at e7b32d9:
        # vx=-axes[2]*3*speed_ratio, vy=axes[0]*1*speed_ratio, yaw=axes[3]*6*speed_ratio.
        joy_command_axes: [2, 0, 3]
        joy_command_signs: [-1.0, 1.0, 1.0]
        joy_command_scales: [3.0, 1.0, 6.0]
        # Exact custom-policy training command envelope.
        joy_command_limits: [1.0, 0.0, 1.0]
        # Operator-approved real command gain after the training-envelope clamp.
        # Full stick therefore reaches vx/yaw +/-0.3, never +/-1.0.
        joy_command_gain: 0.3
        joy_speed_axis: 7
        joy_speed_ratios: [0.33, 0.66, 1.0]
        joy_lateral_enable_axis: 5
        # Operator-confirmed original idle/balance switch in Direct receive-only Joy:
        # released=+1, pressed=-1. A released->pressed edge requests SAFE_HOLD.
        joy_safe_hold_axis: 4
        joy_safe_hold_pressed_max: -0.5
        joy_safe_hold_released_min: 0.5
