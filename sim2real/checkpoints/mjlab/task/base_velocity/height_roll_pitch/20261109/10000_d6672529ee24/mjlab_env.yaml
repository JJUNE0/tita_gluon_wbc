          armature: 0.0
          frictionloss: 0.0
          viscous_damping: 0.0
          delay_min_lag: 0
          delay_max_lag: 4
          delay_hold_prob: 1.0
          delay_update_period: 0
          delay_per_env_phase: true
          stiffness: 60.0
          damping: 1.5
          effort_limit: 60.0
        - target_names_expr:
          - .*_leg_3
