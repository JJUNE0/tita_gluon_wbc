      cameras: []
      textures: []
      materials: []
      meshes: []
      geoms: []
      collisions: []
  sensors:
  - name: feet
    primary:
      mode: body
      pattern:
      - left_leg_4
      - right_leg_4
      entity: robot
      exclude: []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: []
    fields:
    - found
    - force
    reduce: netforce
    num_slots: 1
    secondary_policy: first
    track_air_time: true
    global_frame: false
    history_length: 3
    debug: false
  - name: knees
