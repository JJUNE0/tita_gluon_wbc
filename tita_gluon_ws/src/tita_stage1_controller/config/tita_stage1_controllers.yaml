/**:
  controller_manager:
    ros__parameters:
      update_rate: 500
      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster
      imu_sensor_broadcaster:
        type: imu_sensor_broadcaster/IMUSensorBroadcaster
      tita_stage1_controller:
        type: tita_stage1_controller/Stage1Controller

  joint_state_broadcaster:
    ros__parameters:
      update_rate: 500

  imu_sensor_broadcaster:
    ros__parameters:
      update_rate: 500
      sensor_name: trunk_imu
      frame_id: trunk_imu

  tita_stage1_controller:
    ros__parameters:
      stage1_only: true
      joints:
        - joint_left_leg_1
        - joint_left_leg_2
        - joint_left_leg_3
        - joint_left_leg_4
        - joint_right_leg_1
        - joint_right_leg_2
        - joint_right_leg_3
        - joint_right_leg_4
      transform_up:
        # Exact upstream TITA values from commit e7b32d9746df900680641ff2845ffb0b5ffe99ed.
        fold_jpos: [0.75, 1.20, -2.7, 0.0, -0.75, 1.2, -2.7, 0.0]
        stand_jpos: [-0.05, 0.9, -2.6, 0.0, 0.05, 0.90, -2.6, 0.0]
        fold_timer: 4.0
        stand_timer: 2.0
        ff_torque: [-20.0, 0.0, -25.0, 0.0, 20.0, 0.0, -25.0, 0.0]
        joint_kp: [600.0, 80.0, 80.0, 5.0, 600.0, 80.0, 80.0, 5.0]
        joint_kd: [8.0, 8.0, 8.0, 0.5, 8.0, 8.0, 8.0, 0.5]
        # Transition-only envelope. L3/R3 match the exact official fold command and may be used
        # only while capturing/measuring and executing TransformUp.
        transition_lower_limits: [-0.785398, -1.919862, -2.700000, -62831.85, -0.785398, -1.919862, -2.700000, -62831.85]
        transition_upper_limits: [0.785398, 3.490659, -0.698132, 62831.85, 0.785398, 3.490659, -0.698132, 62831.85]
      settle:
        seconds: 5.0
        stand_error_rad: 0.15
        wheel_velocity_rad_s: 0.3
      safety:
        # Conservative operational envelope used by standing settle and every future RL state.
        lower_limits: [-0.785398, -1.919862, -2.670354, -62831.85, -0.785398, -1.919862, -2.670354, -62831.85]
        upper_limits: [0.785398, 3.490659, -0.698132, 62831.85, 0.785398, 3.490659, -0.698132, 62831.85]
        effort_limits: [60.0, 60.0, 60.0, 20.0, 60.0, 60.0, 60.0, 20.0]
        max_roll_rad: 0.35
        max_pitch_rad: 0.35
        fall_tilt_rad: 0.65
        max_angular_velocity_rad_s: 1.5
        max_target_slew_rad_s: 1.5
        max_period_seconds: 0.01
        # The TITA API receiver is asynchronous. Remain command-free until direct joint/IMU/motor
        # state is continuously valid, and fail closed if it never becomes stable.
        hardware_state_wait_timeout_seconds: 1.0
        hardware_state_stable_seconds: 0.10
        operational_entry_timeout_seconds: 2.0
        operational_entry_stable_seconds: 0.10
        # 2026-07-22 real q6 settled at -2.650565386 rad. A 0.020 rad margin
        # rejected it by 0.000211386 rad despite every other stand gate passing.
        operational_entry_margin_rad: 0.019
        operational_entry_max_joint_velocity_rad_s: 0.5
        operational_envelope_tolerance_rad: 1.0e-6
        command_transport_tolerance_rad: 1.0e-9
        write_failure_threshold: 3
